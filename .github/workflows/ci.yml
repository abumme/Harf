# Harf CI/CD.
#
#   pull_request -> main   backend-tests + client-tests + admin-web
#   push -> main           the tests; then, if backend inputs changed (the image also carries the exported
#                          staff panel), publish the backend image to GHCR and deploy it to the Oracle box
#                          (docs/deploy-oracle.md §13)
#   push tag v*            the tests; publish the image tagged with the git tag (no deploy)
#   workflow_dispatch      the tests; publish; on main also deploy
#   workflow_dispatch with refresh_calendar_snapshot
#                          only refresh-calendar-snapshot: takes the published daily-word calendar from production
#                          and opens a pull request with the app's bundled snapshots (a release-checklist step)
#
# Deploy needs repository secrets ORACLE_SSH_HOST, ORACLE_SSH_USER, ORACLE_SSH_KEY and
# ORACLE_SSH_KNOWN_HOSTS (docs/deploy-oracle.md §13).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_calendar_snapshot:
        description: Only refresh the bundled daily-word calendar snapshot from production and open a pull request
        type: boolean
        default: false

# PR runs cancel superseded ones. Everything else queues: cancelling a main run could kill a deploy
# halfway through the container swap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    # `inputs` is empty outside workflow_dispatch, so every other event runs this job.
    if: ${{ !inputs.refresh_calendar_snapshot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Matches DatabaseFactory's defaults: jdbc:postgresql://localhost:5432/harf, harf / harf_password.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: harf
          POSTGRES_USER: harf
          POSTGRES_PASSWORD: harf_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U harf -d harf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Pinned to v5: v6 moved caching into a proprietary component under separate terms of use.
      - uses: gradle/actions/setup-gradle@v5
      # -PbackendOnly drops the client modules (settings.gradle.kts), so no Android SDK is needed.
      - run: ./gradlew -PbackendOnly :sharedData:jvmTest :backend:test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            sharedData/build/reports/tests/

  client-tests:
    name: Client tests and builds
    if: ${{ !inputs.refresh_calendar_snapshot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The runner image's SDK lags compileSdk = 37; install that platform explicitly.
      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      # The documented compile order, JVM -> Android -> JS/Wasm (iOS is not built in CI).
      # verifyRoborazziJvm is jvmTest in verify mode: every sharedUI unit test plus the goldens.
      # --continue so a screenshot diff can't hide an Android or Wasm compile error.
      - run: >-
          ./gradlew --continue
          :sharedUI:verifyRoborazziJvm
          :androidApp:assembleDebug
          :webApp:compileKotlinJs
          :webApp:compileKotlinWasmJs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-test-reports
          path: |
            sharedUI/build/reports/tests/
            sharedUI/build/outputs/roborazzi/
      # Goldens are canonical as rendered on this runner (fonts, emoji fallback and locale all
      # differ on dev machines). After an intended UI change, download this artifact over
      # sharedUI/roborazzi/, review the diff, and commit it.
      - name: Re-record goldens on the runner
        if: failure()
        continue-on-error: true
        run: ./gradlew :sharedUI:recordRoborazziJvm
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-goldens
          path: sharedUI/roborazzi/

  admin-web:
    name: Admin web panel
    if: ${{ !inputs.refresh_calendar_snapshot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      # Kobweb's export snapshots each page in a Playwright-managed headless Chromium. Cache that browser by the
      # ID Kobweb reports for its Playwright version, as in Kobweb's GitHub workflow guide.
      # -PadminWebOnly builds only :sharedData and :adminWeb, so no Android SDK is needed.
      - name: Query browser cache ID
        id: browser-cache-id
        run: echo "value=$(./gradlew -q -PadminWebOnly :adminWeb:kobwebBrowserCacheId)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.browser-cache-id.outputs.value }}
      # The panel's pure logic (API client, session flow, navigation, forms, paging) in headless Chrome via Karma.
      - run: ./gradlew -PadminWebOnly :adminWeb:jsTest
      - name: Export the panel
        run: >-
          ./gradlew -PadminWebOnly :adminWeb:kobwebExport
          -PkobwebReuseServer=false -PkobwebEnv=DEV -PkobwebRunLayout=STATIC
          -PkobwebBuildTarget=RELEASE -PkobwebExportLayout=STATIC
      - uses: actions/upload-artifact@v7
        with:
          name: admin-web-site
          path: adminWeb/.kobweb/site/
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-web-test-reports
          path: adminWeb/build/reports/tests/

  changes:
    name: Backend changed?
    # Compared against the last green main run rather than this push's `before`, so a run that was
    # superseded while queued, or failed, can't strand a backend change undeployed.
    if: github.event_name != 'pull_request' && !inputs.refresh_calendar_snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          # Inputs of the backend image. Keep in step with backend/Dockerfile and .dockerignore.
          BACKEND_PATHS: >-
            backend sharedData adminWeb gradle gradlew build.gradle.kts settings.gradle.kts gradle.properties
            .dockerignore .github/workflows/ci.yml .github/scripts/deploy-backend.sh
        run: |
          changed=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            if [[ -n "$base" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "Comparing against the last green main run: $base"
              read -ra paths <<< "$BACKEND_PATHS"
              git diff --quiet "$base" "$GITHUB_SHA" -- "${paths[@]}" && changed=false
            else
              echo "No green main run to compare against; treating the backend as changed."
            fi
          fi
          echo "backend=$changed" | tee -a "$GITHUB_OUTPUT"

  refresh-calendar-snapshot:
    name: Refresh calendar snapshot
    # Before a store release: fetch every launch language's published pack from production and write the answers and
    # schedule the app bundles for offline fresh installs (docs/deploy-oracle.md §14). The Gradle task fails, writing
    # nothing, when a pack would be refused by the app. Changed snapshots go to a new branch with a pull request, for
    # review like any other change. Needs "Allow GitHub Actions to create and approve pull requests" in the repository's
    # Actions settings; checks do not start on a pull request opened with GITHUB_TOKEN, so close and reopen it to run CI.
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_calendar_snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Configuring :sharedUI needs the Android SDK platform, as in client-tests.
      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :sharedUI:refreshCalendarSnapshot
      - name: Open a pull request with the changed snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOTS: sharedUI/src/commonMain/composeResources/files
        run: |
          if [[ -z "$(git status --porcelain -- "$SNAPSHOTS")" ]]; then
            echo "The bundled calendar snapshots already match production."
            exit 0
          fi
          branch="calendar-snapshot-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$SNAPSHOTS"/*_calendar.json
          git commit -m "sharedUI: refreshed bundled calendar snapshot"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "sharedUI: refreshed bundled calendar snapshot" \
            --body "The daily-word calendar as published by production on $(date -u +%Y-%m-%d), for the next release build."

  publish-image:
    name: Publish backend image
    needs: [backend-tests, admin-web, changes]
    if: needs.changes.outputs.backend == 'true'
    # Native x86_64 runner: the deploy target is an Oracle AMD shape (uname -m = x86_64).
    # For an Ampere/aarch64 box, switch to `ubuntu-24.04-arm` and linux/arm64 below together;
    # building the other arch under QEMU emulation is roughly 10x slower.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/harf-backend@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/harf-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps the Gradle dependency download out of every rebuild.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle
    needs: publish-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          missing=()
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || missing+=("ORACLE_$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See docs/deploy-oracle.md §13."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # Host key is pinned by ORACLE_SSH_KNOWN_HOSTS; never trust-on-first-use.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "$SSH_USER@$SSH_HOST" bash -s -- "$IMAGE" < .github/scripts/deploy-backend.sh
