# Builds the Harf backend container and publishes it to GHCR as
# ghcr.io/abumme/harf-backend. The Oracle box then pulls that image instead of
# compiling the backend itself (see docs/deploy-oracle.md).
name: Backend image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - 'sharedData/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.dockerignore'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Native x86_64 runner — the deploy target is an Oracle AMD shape (uname -m = x86_64).
    # For an Ampere/aarch64 box instead, switch to `ubuntu-24.04-arm` and linux/arm64 below;
    # building the other arch under QEMU emulation is roughly 10x slower.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/harf-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps the Gradle dependency download out of every rebuild.
          cache-from: type=gha
          cache-to: type=gha,mode=max
