services:
  db:
    image: postgres:16-alpine
    container_name: harf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: harf
      POSTGRES_USER: harf
      POSTGRES_PASSWORD: harf_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
