# Production stack: Postgres + Harf backend, both bound to loopback only.
# The host's Caddy terminates TLS and reverse-proxies https://<domain> -> 127.0.0.1:8080.
# Usage: docker compose -f docker-compose.prod.yml up -d          (pulls the published image)
#        docker compose -f docker-compose.prod.yml up -d --build  (compiles here instead)
services:
  db:
    image: postgres:16-alpine
    container_name: harf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # never exposed publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Published for linux/arm64 by .github/workflows/backend-image.yml. `up -d` pulls it;
    # `up -d --build` compiles from source on this host instead (same tag either way).
    image: ghcr.io/abumme/harf-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: harf-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Point the backend at the db service; overrides anything in .env.
      DB_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080" # host Caddy proxies to this; not public

volumes:
  postgres_data:
