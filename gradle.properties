#Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true

#Kotlin
kotlin.daemon.jvmargs=-Xmx4G
kotlin.native.binary.gc=cms
# Beta in Kotlin 2.4.20: incremental compilation of klib artifacts — faster iOS/Native debug builds.
kotlin.incremental.native=true

#Android
android.useAndroidX=true

# App version — single source for all platforms (Android code+name, desktop packageVersion).
harf.versionCode=4
harf.versionName=1.2.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Auto-provision toolchains (Compose Hot Reload JBR)
org.gradle.java.installations.auto-download=true
